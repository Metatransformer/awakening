; Export presets for `pnpm deploy` (tools/deploy.mjs).
;
; Hand-written, and deliberately SHORT. Godot fills every option it does not
; find here with the platform default, so the only lines below are the ones
; where the default is wrong for this project. If you open Project > Export in
; the editor and save, Godot re-serialises this file to its full ~80-key form —
; that is fine, but re-read the notes here before you change a value it wrote.
;
; `runnable=` is absent on purpose: Godot 4.7 moved it out of the preset file.

[preset.0]

name="macOS"
platform="macOS"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
; A .zip path makes Godot zip the .app itself. butler wants a directory or a
; loose file tree, and a bare .app IS a directory — but pushing it unzipped
; loses the executable bit on the binary inside, and the game will not launch.
export_path="build/macos/The Lower Worlds Awakening.zip"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.metatransformer.lowerworlds"
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright="© 2026 metatransformer"
; 1 = built-in ad-hoc signing. NOT optional on Apple Silicon: an unsigned arm64
; binary is killed by the kernel at exec, so codesign/codesign=0 ships a mac
; build that cannot start at all. Ad-hoc is not notarised — players still get
; "unidentified developer" and right-click > Open the first time — but the game
; runs. See the itch page instructions written by tools/deploy.mjs.
codesign/codesign=1
; 0 = Testing. 1/2 (Distribution/App Store) demand a real Developer ID identity
; and fail the export outright without one.
export/distribution_type=0
notarization/notarization=0

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/The Lower Worlds Awakening.exe"
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/architecture="x86_64"
; false keeps the .pck beside the .exe. butler uploads the folder either way,
; but a separate .pck means a patch that only touches game data re-uploads a
; few MB instead of the whole engine binary.
binary_format/embed_pck=false
; 0 = No. The default (1, Debug Only) is already off for release exports; this
; just makes it explicit that no console .exe is shipped.
debug/export_console_wrapper=0
application/product_name="The Lower Worlds: Awakening"
application/file_description="The Lower Worlds: Awakening"
application/company_name="metatransformer"
application/file_version="0.1.0"
application/product_version="0.1.0"
application/copyright="© 2026 metatransformer"
